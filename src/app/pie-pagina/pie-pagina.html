<footer class="pie">
  <div class="interior">
    @if (logo) {
      <img class="logo" [src]="logo" alt="IMZO" loading="lazy" decoding="async" />
    } @else {
      <p class="logo-texto">IMZO</p>
    }

    <ul class="redes">
      <li>
        <a [href]="urlFacebook" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.4H7.6V14h2.7v8h3.2Z"
            />
          </svg>
          Facebook
        </a>
      </li>
      <li>
        <a [href]="urlTiktok" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M16.6 3c.4 2.2 1.7 3.6 3.9 3.8v3.1c-1.4.1-2.7-.3-3.9-1.1v6.1a5.9 5.9 0 1 1-5.9-5.9h.6v3.2a2.8 2.8 0 1 0 2.1 2.7V3h3.2Z"
            />
          </svg>
          TikTok
        </a>
      </li>
    </ul>
  </div>
</footer>
